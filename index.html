<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --text: var(--tg-theme-text-color, #0f0f10);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: rgba(120,120,128,.14);
    --card: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: var(--tg-theme-bg-color, #0e1621);
      --bg2: var(--tg-theme-secondary-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #7d8b99);
      --sep: rgba(255,255,255,.07);
      --card: var(--tg-theme-secondary-bg-color, #182533);
      --shadow: none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:16px;line-height:1.4;
    overscroll-behavior:none;
  }

  /* ── header ── */
  .head{
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    border-bottom:.5px solid var(--sep);
    background:var(--bg);
    position:sticky;top:0;z-index:10;
  }
  .avatar{
    width:42px;height:42px;flex:0 0 42px;border-radius:50%;
    background:linear-gradient(135deg,#37BBFE 0%,#007DBB 100%);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;font-size:18px;
    box-shadow:0 0 0 2px rgba(55,187,254,.15);
  }
  .head .who{flex:1;min-width:0;line-height:1.2}
  .head .name{
    font-size:17px;font-weight:600;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .head .status{
    font-size:13px;color:var(--hint);
    display:flex;align-items:center;gap:5px;margin-top:2px;
  }
  .head .status .dot{
    width:6px;height:6px;border-radius:50%;background:#31b545;
  }

  /* ── container ── */
  .wrap{
    padding:16px;
    max-width:520px;
    margin:0 auto;
    display:flex;flex-direction:column;gap:14px;
  }

  @keyframes pop{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
  }
  .anim{animation:pop .22s cubic-bezier(.2,.8,.2,1) both}

  /* ── card ── */
  .card{
    background:var(--card);
    border-radius:16px;
    padding:18px 18px 16px;
    box-shadow:var(--shadow);
    border:1px solid rgba(127,127,127,.07);
  }
  @media (prefers-color-scheme: dark){
    .card{border-color:rgba(255,255,255,.04)}
  }

  .label{
    font-size:12px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;
    color:var(--hint);margin-bottom:8px;
  }
  .amount{
    font-size:30px;font-weight:700;letter-spacing:-.02em;
    line-height:1.1;
    display:flex;align-items:baseline;gap:7px;
    margin-bottom:6px;
  }
  .amount .curr{
    font-size:15px;font-weight:500;
    color:var(--hint);letter-spacing:0;
  }
  .sub{
    font-size:14px;color:var(--hint);line-height:1.45;
    margin-bottom:16px;
  }
  .sub b{color:var(--text);font-weight:600}
  .sub a{color:var(--link);text-decoration:none}

  .row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 0;
    border-top:1px solid var(--sep);
    font-size:14px;
  }
  .row:first-of-type{border-top:none;padding-top:2px}
  .row .k{color:var(--hint)}
  .row .v{font-weight:600;font-variant-numeric:tabular-nums}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    background:rgba(49,181,69,.14);color:#2ea043;
    padding:3px 9px;border-radius:8px;
    font-size:12px;font-weight:600;
  }
  .badge::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:currentColor;
  }

  /* ── steps ── */
  .steps-head{
    font-size:14px;font-weight:600;
    margin-bottom:12px;
    display:flex;align-items:center;gap:8px;
  }
  .step{
    display:flex;gap:12px;align-items:flex-start;
    padding:9px 0;
    font-size:14.5px;line-height:1.45;
  }
  .step .num{
    flex:0 0 24px;width:24px;height:24px;border-radius:50%;
    background:rgba(120,130,150,.14);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    margin-top:1px;
  }
  .step b{font-weight:600}

  /* ── actions ── */
  .actions{
    display:flex;flex-direction:column;gap:10px;
    margin-top:4px;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    height:50px;padding:0 18px;
    border:none;border-radius:14px;
    font:inherit;font-size:16px;font-weight:600;letter-spacing:-.01em;
    cursor:pointer;text-decoration:none;
    -webkit-user-select:none;user-select:none;
    transition:transform .12s, opacity .12s;
  }
  .btn:active{transform:scale(.985);opacity:.9}
  .btn.primary{
    background:var(--btn);color:var(--btn-text);
    box-shadow:0 1px 3px rgba(36,129,204,.25);
  }
  .btn.secondary{
    background:var(--card);
    color:var(--text);
    border:1px solid rgba(127,127,127,.1);
  }
  @media (prefers-color-scheme: dark){
    .btn.secondary{border-color:rgba(255,255,255,.06)}
  }

  .loading{
    color:var(--hint);text-align:center;
    padding:60px 20px;font-size:14px;
  }
</style>
</head>
<body>

<div class="head">
  <div class="avatar">T</div>
  <div class="who">
    <div class="name">Telegram</div>
    <div class="status"><span class="dot"></span>bot · online</div>
  </div>
</div>

<div class="wrap" id="root">
  <div class="loading" id="loading">Загрузка сделки…</div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();
  try { tg?.setHeaderColor?.('bg_color'); } catch(_){}
  try { tg?.setBackgroundColor?.('bg_color'); } catch(_){}
  try { tg?.disableVerticalSwipes?.(); } catch(_){}

  function b64decode(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const b = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(b);
  }
  const startParam = tg?.initDataUnsafe?.start_param
    || new URLSearchParams(location.search).get('startapp') || '';

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function el(html, cls){
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.innerHTML = html;
    d.classList.add('anim');
    return d;
  }

  function render(d){
    const root = document.getElementById('root');
    root.innerHTML = '';

    const currLabel = d.c === 'stars' ? 'Stars' : 'Gram';

    // 1. карточка оффера
    const card = el(`
      <div class="card">
        <div class="label">Предложение</div>
        <div class="amount">${esc(d.p)}<span class="curr">${currLabel}</span></div>
        <div class="sub">за подарок <b>«${esc(d.n)}»</b></div>

        <div class="row">
          <span class="k">Ордер</span>
          <span class="v">#TG-${esc(d.o)}</span>
        </div>
        <div class="row">
          <span class="k">Статус</span>
          <span class="v"><span class="badge">Ожидает</span></span>
        </div>
      </div>
    `);
    root.appendChild(card);

    // 2. инструкция
    const steps = el(`
      <div class="card">
        <div class="steps-head">Как передать подарок</div>
        <div class="step"><span class="num">1</span><span>Откройте чат с получателем <b>@${esc(d.r)}</b></span></div>
        <div class="step"><span class="num">2</span><span>Передайте подарок <b>«${esc(d.n)}»</b></span></div>
        <div class="step"><span class="num">3</span><span>Вернитесь сюда и подтвердите передачу</span></div>
      </div>
    `);
    root.appendChild(steps);

    // 3. действия
    const actions = el(`
      <a class="btn secondary" id="openBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 2.3 2.9 9.9c-1 .4-1 1.8.1 2.1l4.7 1.5 1.7 5.4c.3 1 1.6 1.2 2.2.3l2.4-3.2 4.7 3.5c.8.6 2 .2 2.2-.8L22.9 3.4c.2-1-.4-1.4-1.2-1.1z"/></svg>
        Открыть чат с получателем
      </a>
      <button class="btn primary" id="confirmBtn">Подтвердить передачу</button>
    `, 'actions');
    root.appendChild(actions);

    document.getElementById('loading')?.remove();

    document.getElementById('openBtn').href = 'https://t.me/' + d.r;

    document.getElementById('confirmBtn').addEventListener('click', () => {
      if (tg?.showAlert) {
        tg.showAlert('Передача подтверждена. Сделка завершается.', () => {
          try { tg.close(); } catch(_){}
        });
      } else {
        alert('Передача подтверждена.');
      }
    });
  }

  if (!startParam) {
    document.getElementById('loading').textContent = 'Сделка не найдена.';
  } else {
    try {
      render(JSON.parse(b64decode(startParam)));
    } catch(e) {
      document.getElementById('loading').textContent = 'Сделка не найдена или повреждена.';
    }
  }
</script>
</body>
</html>

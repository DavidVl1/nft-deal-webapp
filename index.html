<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --text: var(--tg-theme-text-color, #0f0f10);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: rgba(120,120,128,.16);
    --bubble: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --card: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --shadow-1: 0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
    --shadow-2: 0 2px 6px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-btn: 0 1px 2px rgba(36,129,204,.25);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: var(--tg-theme-bg-color, #0e1621);
      --bg2: var(--tg-theme-secondary-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #7d8b99);
      --sep: rgba(255,255,255,.08);
      --bubble: var(--tg-theme-secondary-bg-color, #182533);
      --card: var(--tg-theme-secondary-bg-color, #182533);
      --shadow-1: 0 1px 2px rgba(0,0,0,.25);
      --shadow-2: 0 2px 8px rgba(0,0,0,.35);
      --shadow-btn: 0 1px 3px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:16px;line-height:1.4;
    overscroll-behavior:none;
  }

  /* ── chat header ── */
  .chat-header{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--sep);
    min-height:56px;
  }
  .chat-header .back{
    width:24px;height:24px;flex:0 0 24px;
    display:flex;align-items:center;justify-content:center;
    color:var(--link);font-size:24px;line-height:1;font-weight:400;
    margin-left:-4px;
  }
  .avatar{
    width:40px;height:40px;flex:0 0 40px;border-radius:50%;
    background:linear-gradient(135deg,#37BBFE 0%,#007DBB 100%);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;font-size:18px;
    user-select:none;
    box-shadow:0 0 0 2px rgba(255,255,255,.12), var(--shadow-1);
    position:relative;
  }
  .avatar::after{
    content:"";
    position:absolute;inset:-3px;border-radius:50%;
    border:1.5px solid rgba(55,187,254,.35);
  }
  .chat-header .who{flex:1;min-width:0;line-height:1.2}
  .chat-header .who .name{
    font-size:16px;font-weight:600;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    letter-spacing:-.01em;
  }
  .chat-header .who .status{
    font-size:13px;color:var(--hint);
    display:flex;align-items:center;gap:4px;
  }
  .chat-header .who .status .dot{
    width:6px;height:6px;border-radius:50%;background:#31b545;
    box-shadow:0 0 0 2px rgba(49,181,69,.18);
  }
  .chat-header .icon{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--hint);
    background:transparent;
  }

  /* ── chat area ── */
  .chat{
    padding:12px 10px 24px;
    min-height:calc(100vh - 56px);
    display:flex;flex-direction:column;gap:8px;
  }

  @keyframes popIn{
    from{opacity:0;transform:translateY(6px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .anim{animation:popIn .22s cubic-bezier(.2,.8,.2,1) both}

  /* ── premium card inside bubble ── */
  .card{
    background:var(--card);
    border-radius:16px;
    padding:16px 16px 14px;
    box-shadow:var(--shadow-1);
    border:1px solid rgba(127,127,127,.08);
    max-width:92%;
    align-self:flex-start;
    position:relative;
  }
  @media (prefers-color-scheme: dark){
    .card{border-color:rgba(255,255,255,.05)}
  }
  .card .label{
    font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--hint);margin-bottom:6px;
  }
  .card .amount{
    font-size:28px;font-weight:700;letter-spacing:-.02em;
    line-height:1.15;display:flex;align-items:baseline;gap:6px;
    margin-bottom:4px;
  }
  .card .amount .curr{
    font-size:14px;font-weight:500;color:var(--hint);letter-spacing:0;
  }
  .card .sub{
    font-size:14px;color:var(--hint);line-height:1.4;
    margin-bottom:14px;
  }
  .card .sub a{color:var(--link);text-decoration:none}

  .kv{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;
    border-top:1px solid var(--sep);
    font-size:14px;
  }
  .kv:first-of-type{border-top:none;padding-top:4px}
  .kv .k{color:var(--hint);display:flex;align-items:center;gap:6px}
  .kv .v{font-weight:600;color:var(--text);max-width:60%;text-align:right;
    word-break:break-all;font-variant-numeric:tabular-nums}
  .kv .badge{
    display:inline-flex;align-items:center;gap:4px;
    background:rgba(49,181,69,.12);color:#31b545;
    padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;
  }

  /* ── inline keyboard ── */
  .kbd{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
    margin-top:4px;max-width:92%;align-self:flex-start;width:92%;
  }
  .kbd.one{grid-template-columns:1fr}
  .kbd button, .kbd a{
    display:flex;align-items:center;justify-content:center;gap:6px;
    height:44px;padding:0 14px;border:none;border-radius:12px;
    background:var(--btn);color:var(--btn-text);
    font:inherit;font-size:16px;font-weight:600;letter-spacing:-.01em;
    cursor:pointer;text-decoration:none;
    -webkit-user-select:none;user-select:none;
    transition:transform .12s, opacity .12s;
    box-shadow:var(--shadow-btn);
  }
  .kbd button:active, .kbd a:active{transform:scale(.97);opacity:.9}
  .kbd button.sec, .kbd a.sec{
    background:var(--bubble);color:var(--text);
    box-shadow:var(--shadow-1);
  }
  .kbd .accept{
    background:linear-gradient(180deg,
      color-mix(in srgb, var(--btn) 92%, white) 0%,
      var(--btn) 100%);
  }

  /* ── instructions card ── */
  .steps{
    background:var(--card);
    border-radius:16px;padding:14px 16px;
    box-shadow:var(--shadow-1);
    border:1px solid rgba(127,127,127,.08);
    max-width:92%;align-self:flex-start;
  }
  @media (prefers-color-scheme: dark){
    .steps{border-color:rgba(255,255,255,.05)}
  }
  .steps .head{
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:600;margin-bottom:10px;
    color:var(--text);
  }
  .steps .head svg{color:var(--hint)}
  .step{
    display:flex;gap:12px;align-items:flex-start;
    padding:8px 0;
    font-size:14px;color:var(--text);line-height:1.45;
  }
  .step .num{
    flex:0 0 22px;width:22px;height:22px;border-radius:50%;
    background:color-mix(in srgb, var(--btn) 14%, transparent);
    color:var(--btn);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    margin-top:1px;
  }

  .time-meta{
    font-size:12px;color:var(--hint);
    display:flex;align-items:center;gap:4px;
    padding-left:6px;
    margin-top:-2px;
  }
  .time-meta .check{color:#4fae4e}

  /* ── input bar ── */
  .inputbar{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:center;gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:.5px solid var(--sep);
  }
  .inputbar .field{
    flex:1;height:38px;border-radius:19px;
    background:var(--bubble);
    display:flex;align-items:center;padding:0 14px;
    color:var(--hint);font-size:16px;
  }
  .inputbar .mic{
    width:38px;height:38px;border-radius:50%;
    background:var(--bubble);
    display:flex;align-items:center;justify-content:center;
    color:var(--hint);
  }

  .loading{color:var(--hint);text-align:center;padding:40px 0;font-size:14px}
  .chat{padding-bottom:90px}
</style>
</head>
<body>

<div class="chat-header">
  <div class="back">‹</div>
  <div class="avatar" id="avatar">T</div>
  <div class="who">
    <div class="name">Telegram</div>
    <div class="status"><span class="dot"></span>bot · online</div>
  </div>
  <div class="icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
  </div>
</div>

<div class="chat" id="chat">
  <div class="loading" id="loading">Загрузка сделки…</div>
</div>

<div class="inputbar">
  <div class="field">Сообщение</div>
  <div class="mic">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready(); tg?.expand();
  try { tg?.setHeaderColor?.('bg_color'); } catch(_){}
  try { tg?.setBackgroundColor?.('bg_color'); } catch(_){}
  try { tg?.disableVerticalSwipes?.(); } catch(_){}

  function b64decode(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  const startParam = tg?.initDataUnsafe?.start_param
    || new URLSearchParams(location.search).get('startapp') || '';

  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function nowTime(){
    const d=new Date();
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function el(html, cls){
    const d=document.createElement('div');
    if(cls) d.className=cls;
    d.innerHTML=html;
    d.classList.add('anim');
    return d;
  }
  function meta(t){
    return '<div class="time-meta">'+t+' <span class="check">✓✓</span></div>';
  }

  function render(d){
    const chat = document.getElementById('chat');
    chat.innerHTML = '';

    const currLabel = d.c === 'stars' ? 'Stars' : 'Gram';

    // 1. premium card — предложение
    const card = el(`
      <div class="card">
        <div class="label">Предложение</div>
        <div class="amount">${esc(d.p)}<span class="curr">${currLabel}</span></div>
        <div class="sub">за подарок <a href="https://t.me/${esc(d.r)}" target="_blank" rel="noopener">«${esc(d.n)}»</a></div>

        <div class="kv">
          <span class="k">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6M9 16h4M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
            Ордер
          </span>
          <span class="v">#TG-${esc(d.o)}</span>
        </div>
        <div class="kv">
          <span class="k">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            Действует
          </span>
          <span class="v">6 ч. 0 мин.</span>
        </div>
        <div class="kv">
          <span class="k">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            Статус
          </span>
          <span class="v"><span class="badge">● Ожидает</span></span>
        </div>
      </div>
      ${meta(nowTime())}
    `, 'card-wrap');
    card.style.maxWidth='92%';
    card.style.alignSelf='flex-start';
    card.querySelector('.card').style.maxWidth='100%';
    card.style.padding='0';
    card.style.background='transparent';
    card.style.boxShadow='none';
    card.style.border='none';
    chat.appendChild(card);

    // 2. инструкция
    const steps = el(`
      <div class="steps">
        <div class="head">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
          Как передать подарок
        </div>
        <div class="step"><span class="num">1</span><span>Откройте чат с получателем — <b>@${esc(d.r)}</b></span></div>
        <div class="step"><span class="num">2</span><span>Передайте подарок «<b>${esc(d.n)}</b>»</span></div>
        <div class="step"><span class="num">3</span><span>Вернитесь и нажмите <b>Принять</b></span></div>
      </div>
      ${meta(nowTime())}
    `, 'card-wrap');
    steps.style.maxWidth='92%';
    steps.style.alignSelf='flex-start';
    chat.appendChild(steps);

    // 3. inline keyboard
    const kbd = el(`
      <button class="sec" id="declineBtn">Отклонить</button>
      <a class="accept" id="acceptBtn">Принять</a>
    `, 'kbd');
    chat.appendChild(kbd);

    // 4. следующий шаг / открыть чат получателя
    const open = el(`
      <div class="card">
        <div class="label">Получатель</div>
        <div class="amount" style="font-size:20px">
          @${esc(d.r)}
        </div>
        <div class="sub" style="margin-bottom:12px">Нажмите, чтобы открыть чат и передать подарок.</div>
        <a href="https://t.me/${esc(d.r)}" target="_blank" rel="noopener"
           style="display:flex;align-items:center;justify-content:center;gap:6px;
                  height:44px;border-radius:12px;background:var(--btn);color:var(--btn-text);
                  text-decoration:none;font-weight:600;box-shadow:var(--shadow-btn)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 2.3 2.9 9.9c-1 .4-1 1.8.1 2.1l4.7 1.5 1.7 5.4c.3 1 1.6 1.2 2.2.3l2.4-3.2 4.7 3.5c.8.6 2 .2 2.2-.8L22.9 3.4c.2-1-.4-1.4-1.2-1.1z"/></svg>
          Открыть чат с получателем
        </a>
      </div>
      ${meta(nowTime())}
    `, 'card-wrap');
    open.style.maxWidth='92%';
    open.style.alignSelf='flex-start';
    chat.appendChild(open);

    document.getElementById('loading').style.display='none';

    document.getElementById('declineBtn').addEventListener('click', ()=>{
      if (tg?.showAlert) tg.showAlert('Предложение отклонено.');
      else alert('Предложение отклонено.');
    });
    document.getElementById('acceptBtn').addEventListener('click', ()=>{
      window.location.href='https://t.me/'+d.r;
    });
  }

  if(!startParam){ document.getElementById('loading').textContent='Сделка не найдена.'; }
  else{
    try{ render(JSON.parse(b64decode(startParam))); }
    catch(e){ document.getElementById('loading').textContent='Сделка не найдена или повреждена.'; }
  }
</script>
</body>
</html>
